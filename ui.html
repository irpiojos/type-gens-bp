<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 12px;
        color: #333;
        background: #fff;
      }

      .panel {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      label {
        font-weight: 600;
        display: block;
        margin-bottom: 4px;
      }

      textarea {
        width: 100%;
        min-height: 72px;
        resize: vertical;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        padding: 8px;
        font: inherit;
        line-height: 1.4;
      }

      textarea:focus {
        outline: 2px solid #18a0fb;
        border-color: #18a0fb;
      }

      .menu {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        background: #f5f5f5;
        border-radius: 8px;
        border: 1px solid #e6e6e6;
      }

      .menu input[type='number'] {
        width: 64px;
        padding: 4px 6px;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        font: inherit;
      }

      .hint {
        color: #888;
        font-size: 11px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div>
        <label for="text">Type chips</label>
        <textarea id="text" placeholder="BRANDS&amp;PEOPLE" spellcheck="false"></textarea>
      </div>

      <div class="menu">
        <label for="gutter">Gutter</label>
        <input id="gutter" type="number" min="0" step="1" value="0" />
        <span class="hint">px between chips</span>
      </div>

      <p class="hint">
        Supported: A–Z, a–z, 0–9, and ! @ $ % &amp;. Press Enter for a new row.
      </p>
    </div>

    <script>
      const textEl = document.getElementById('text');
      const gutterEl = document.getElementById('gutter');

      function sendRender() {
        parent.postMessage(
          {
            pluginMessage: {
              type: 'render',
              text: textEl.value,
              gutter: Number(gutterEl.value) || 0,
            },
          },
          '*'
        );
      }

      let timer;
      function scheduleRender() {
        clearTimeout(timer);
        timer = setTimeout(sendRender, 120);
      }

      textEl.addEventListener('input', scheduleRender);
      gutterEl.addEventListener('input', scheduleRender);

      textEl.value = 'BRANDS&PEOP\nLE';
      sendRender();
    </script>
  </body>
</html>
